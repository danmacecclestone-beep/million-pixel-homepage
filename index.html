
<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Claim your place on Million Pixel. Buy advertising space on a shared pixel wall.">
  <title>Million Pixel — Own a Piece of the Wall</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #111111;
      --panel: #1c1c1c;
      --pixel: #292929;
      --accent: #f5c542;
      --text: #f5f5f5;
      --muted: #b0b0b0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    header { padding: 36px 16px 20px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -1px;
    }

    header p, .muted { color: var(--muted); }

    main {
      width: min(1100px, 94%);
      margin: 0 auto;
    }

    .info {
      margin: 20px auto;
      padding: 22px;
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 12px;
    }

    .action {
      display: inline-block;
      padding: 13px 22px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #171717;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }

    .action:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #wall {
      display: grid;
      grid-template-columns: repeat(100, minmax(0, 1fr));
      gap: 1px;
      width: 100%;
      margin: 24px auto;
      padding: 5px;
      background: #383838;
      border-radius: 4px;
      touch-action: none;
      user-select: none;
    }

    .pixel {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: var(--pixel);
      cursor: crosshair;
      touch-action: none;
    }

    .pixel:hover { outline: 1px solid white; }

    .pixel.selected { background: var(--accent); }

    #checkout-message {
      min-height: 1.5em;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 25px 10px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Million Pixel</h1>
    <p>Own a piece of the wall. Make your mark.</p>
  </header>

  <main>
    <section class="info">
      <h2>Claim your place on the wall</h2>
      <p>Click and drag across the squares to make a selection.</p>
      <p id="status" aria-live="polite">No squares selected yet.</p>
      <p id="price">Indicative price: NZ$0</p>
      <button id="checkout" type="button" class="action">
        Pay for advertising
      </button>
      <p id="checkout-message" role="status" aria-live="polite"></p>
      <p class="muted">NZ$1 per square. Payments are currently in test mode.</p>
    </section>

    <div id="wall" aria-label="Million Pixel advertising wall"></div>
  </main>

  <footer>
    Million Pixel — a wall of possibilities.
  </footer>

  <script>
    const WORKER_URL =
      "https://million-pixel-checkout.danmacecclestone.workers.dev";

    const wall = document.getElementById("wall");
    const status = document.getElementById("status");
    const price = document.getElementById("price");
    const checkout = document.getElementById("checkout");
    const checkoutMessage = document.getElementById("checkout-message");

    const columns = 100;
    const rows = 100;
    const total = columns * rows;
    const selected = new Set();

    let dragging = false;
    let startIndex = null;

    for (let i = 0; i < total; i++) {
      const pixel = document.createElement("button");

      pixel.type = "button";
      pixel.className = "pixel";
      pixel.setAttribute("aria-label", "Pixel " + (i + 1));
      pixel.title = "Pixel " + (i + 1);

      pixel.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        dragging = true;
        startIndex = i;
        selectArea(i, i);
      });

      pixel.addEventListener("pointerenter", function () {
        if (dragging && startIndex !== null) {
          selectArea(startIndex, i);
        }
      });

      wall.appendChild(pixel);
    }

    window.addEventListener("pointerup", function () {
      dragging = false;
      startIndex = null;
    });

    window.addEventListener("pointercancel", function () {
      dragging = false;
      startIndex = null;
    });

    function selectArea(start, end) {
      selected.forEach(function (index) {
        wall.children[index].classList.remove("selected");
      });

      selected.clear();

      const row1 = Math.floor(start / columns);
      const col1 = start % columns;
      const row2 = Math.floor(end / columns);
      const col2 = end % columns;

      const top = Math.min(row1, row2);
      const bottom = Math.max(row1, row2);
      const left = Math.min(col1, col2);
      const right = Math.max(col1, col2);

      for (let row = top; row <= bottom; row++) {
        for (let col = left; col <= right; col++) {
          const index = row * columns + col;

          selected.add(index);
          wall.children[index].classList.add("selected");
        }
      }

      status.textContent = selected.size + " square(s) selected.";
      price.textContent = "Indicative price: NZ$" + selected.size;
      checkoutMessage.textContent = "";
    }

    checkout.addEventListener("click", async function () {
      if (selected.size < 1) {
        checkoutMessage.textContent = "Please select at least one square.";
        return;
      }

      checkout.disabled = true;
      checkoutMessage.textContent = "Preparing your checkout...";

      try {
        const response = await fetch(
          WORKER_URL + "/create-checkout",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ squares: selected.size })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.url) {
          throw new Error(
            result.error || "Checkout could not be created."
          );
        }

        window.location.href = result.url;
      } catch (error) {
        checkoutMessage.textContent =
          error.message || "Something went wrong. Please try again.";
        checkout.disabled = false;
      }
    });
  </script>
</body>
</html>
