
<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Buy advertising space on the Million Pixel wall.">
  <title>Million Pixel — Own a Piece of the Wall</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #111;
      --panel: #1c1c1c;
      --pixel: #303030;
      --accent: #f5c542;
      --text: #f5f5f5;
      --muted: #b0b0b0;
      --sold: #507b63;
      --reserved: #876b42;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    header { padding: 36px 16px 20px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    header p, .muted { color: var(--muted); }

    main {
      width: min(1100px, 94%);
      margin: 0 auto;
    }

    .info {
      margin: 20px auto;
      padding: 22px;
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 12px;
    }

    .action {
      display: inline-block;
      padding: 13px 22px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #171717;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .action:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .key {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 5px;
      border-radius: 2px;
      vertical-align: -1px;
    }

    #wall {
      display: grid;
      grid-template-columns: repeat(100, minmax(0, 1fr));
      gap: 1px;
      width: 100%;
      margin: 24px auto;
      padding: 5px;
      background: #383838;
      border-radius: 4px;
      user-select: none;
      touch-action: none;
    }

    .pixel {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: var(--pixel);
      cursor: crosshair;
      touch-action: none;
    }

    .pixel.selected { background: var(--accent); }
    .pixel.sold { background: var(--sold); cursor: not-allowed; }
    .pixel.reserved { background: var(--reserved); cursor: not-allowed; }
    .pixel:focus-visible { outline: 2px solid white; }

    #price {
      font-size: 1.3rem;
      font-weight: bold;
    }

    #checkout-message {
      min-height: 1.5em;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 25px 10px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Million Pixel</h1>
    <p>Own a piece of the wall. Make your mark.</p>
  </header>

  <main>
    <section class="info">
      <h2>Claim your place on the wall</h2>
      <p>Select available squares by clicking or dragging.</p>

      <div class="legend">
        <span><i class="key" style="background:var(--pixel)"></i>Available</span>
        <span><i class="key" style="background:var(--accent)"></i>Selected</span>
        <span><i class="key" style="background:var(--reserved)"></i>Reserved</span>
        <span><i class="key" style="background:var(--sold)"></i>Sold</span>
      </div>

      <p id="status" aria-live="polite">Loading the wall...</p>
      <p id="price">Total: NZ$0.00</p>

      <button id="checkout" type="button" class="action" disabled>
        Pay for advertising
      </button>

      <p id="checkout-message" role="status" aria-live="polite"></p>

      <button id="refresh" type="button" class="action">
        Refresh availability
      </button>

      <p class="muted">
        NZ$1 per square. Payments are in test mode.
      </p>
    </section>

    <div id="wall" aria-label="Million Pixel advertising wall"></div>
  </main>

  <footer>Million Pixel — a wall of possibilities.</footer>

  <script>
    const WORKER_URL =
      "https://million-pixel-checkout.danmacecclestone.workers.dev";

    const columns = 100;
    const total = 10000;

    const wall = document.getElementById("wall");
    const status = document.getElementById("status");
    const price = document.getElementById("price");
    const checkout = document.getElementById("checkout");
    const refresh = document.getElementById("refresh");
    const message = document.getElementById("checkout-message");

    const selected = new Set();
    const pixels = [];

    let dragging = false;
    let dragMode = "select";
    let wallLoaded = false;
    let checkoutRunning = false;

    function formatPrice(amount) {
      return new Intl.NumberFormat("en-NZ", {
        style: "currency",
        currency: "NZD"
      }).format(amount);
    }

    function updateDisplay() {
      const count = selected.size;

      status.textContent =
        count + (count === 1 ? " square selected." : " squares selected.");

      price.textContent = "Total: " + formatPrice(count);
      checkout.disabled = !wallLoaded || checkoutRunning || count === 0;
    }

    function isAvailable(id) {
      return pixels[id] && pixels[id].status === "available";
    }

    function setPixel(id, shouldSelect) {
      if (!isAvailable(id)) return;

      if (shouldSelect) {
        selected.add(id);
        wall.children[id].classList.add("selected");
      } else {
        selected.delete(id);
        wall.children[id].classList.remove("selected");
      }

      updateDisplay();
    }

    function clearSelection() {
      for (const id of selected) {
        wall.children[id].classList.remove("selected");
      }

      selected.clear();
      updateDisplay();
    }

    function createWall() {
      for (let id = 0; id < total; id++) {
        const pixel = document.createElement("button");

        pixel.type = "button";
        pixel.className = "pixel";
        pixel.setAttribute("aria-label", "Pixel " + (id + 1));
        pixel.title = "Pixel " + (id + 1);

        pixel.addEventListener("pointerdown", function (event) {
          if (!wallLoaded || checkoutRunning) return;

          if (event.button !== 0 && event.pointerType === "mouse") {
            return;
          }

          if (!isAvailable(id)) return;

          event.preventDefault();
          dragging = true;
          dragMode = selected.has(id) ? "deselect" : "select";

          setPixel(id, dragMode === "select");
        });

        pixel.addEventListener("pointerenter", function () {
          if (!dragging || !wallLoaded || checkoutRunning) return;

          setPixel(id, dragMode === "select");
        });

        wall.appendChild(pixel);
      }
    }

    async function loadPixels() {
      wallLoaded = false;
      checkout.disabled = true;
      refresh.disabled = true;
      message.textContent = "Loading availability...";

      try {
        const response = await fetch(WORKER_URL + "/pixels");
        const result = await response.json();

        if (!response.ok || !Array.isArray(result.pixels) ||
            result.pixels.length !== total) {
          throw new Error("The wall could not be loaded correctly.");
        }

        for (const item of result.pixels) {
          if (!Number.isInteger(item.pixel_id) ||
              item.pixel_id < 0 || item.pixel_id >= total ||
              !["available", "reserved", "sold"].includes(item.status)) {
            throw new Error("The server returned invalid pixel data.");
          }
        }

        const nextPixels = new Array(total);

        for (const item of result.pixels) {
          if (nextPixels[item.pixel_id]) {
            throw new Error("Duplicate pixel data was received.");
          }
          nextPixels[item.pixel_id] = item;
        }

        if (nextPixels.some(item => !item)) {
          throw new Error("Some squares are missing from the wall.");
        }

        for (let id = 0; id < total; id++) {
          pixels[id] = nextPixels[id];

          const pixel = wall.children[id];
          pixel.classList.remove("sold", "reserved", "selected");
          pixel.classList.add(pixels[id].status);

          pixel.disabled = pixels[id].status !== "available";

          pixel.title =
            "Pixel " + (id + 1) + " — " + pixels[id].status;

          pixel.setAttribute(
            "aria-label",
            "Pixel " + (id + 1) + " — " + pixels[id].status
          );

          if (selected.has(id) && !isAvailable(id)) {
            selected.delete(id);
          }

          if (selected.has(id)) {
            pixel.classList.add("selected");
          }
        }

        wallLoaded = true;
        message.textContent = "Availability updated.";
        updateDisplay();
      } catch (error) {
        wallLoaded = false;
        message.textContent =
          "Could not load the wall. Please try again. " +
          (error.message || "");
        updateDisplay();
      } finally {
        refresh.disabled = false;
      }
    }

    window.addEventListener("pointerup", function () {
      dragging = false;
    });

    window.addEventListener("pointercancel", function () {
      dragging = false;
    });

    refresh.addEventListener("click", loadPixels);

    checkout.addEventListener("click", async function () {
      if (!wallLoaded || checkoutRunning || selected.size === 0) {
        return;
      }

      const pixelIds = Array.from(selected);

      checkoutRunning = true;
      checkout.disabled = true;
      refresh.disabled = true;
      message.textContent = "Preparing secure checkout...";

      try {
        const response = await fetch(
          WORKER_URL + "/create-checkout",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pixelIds })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.url) {
          if (response.status === 409) {
            await loadPixels();
          }
          throw new Error(
            result.error || "Checkout could not be created."
          );
        }

        window.location.href = result.url;
      } catch (error) {
        message.textContent =
          error.message || "Something went wrong. Please try again.";
        checkoutRunning = false;
        checkout.disabled = false;
        refresh.disabled = false;
        updateDisplay();
      }
    });

    createWall();
    loadPixels();

    const paymentStatus = new URLSearchParams(
      window.location.search
    ).get("payment");

    if (paymentStatus === "success") {
      message.textContent =
        "Checkout returned successfully. The wall will update after Stripe confirms payment.";
    } else if (paymentStatus === "cancelled") {
      message.textContent =
        "Checkout was cancelled. Refresh availability before trying again.";
    }
  </script>
</body>
</html>
