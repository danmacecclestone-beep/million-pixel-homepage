
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Million Pixel Project</title>



}
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}
header { padding: 35px 15px; }
h1 { font-size: clamp(28px, 5vw, 48px); margin-bottom: 10px; }
p { color: #ccc; }
.wall {
  display: grid;
  grid-template-columns: repeat(100, 1fr);
  gap: 2px;
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
  background: #333;
}
.pixel {
  aspect-ratio: 1;
  background: #252525;
  border: 0;
  padding: 0;
  cursor: pointer;
}

}
footer { padding: 25px; color: #888; }
button.action {
  background: #f5c542;
  color: #111;
  border: 0;
  border-radius: 6px;
  padding: 12px 20px;
  font-weight: bold;
  cursor: pointer;
}
}</style>
</head>
<body>
<header>
  <h1>The Million Pixel Project</h1>
  <p>One million pixels. One dollar each. Your little piece of the internet.</p>
  <button class="action" onclick="document.getElementById('wall').scrollIntoView({behavior:'smooth'})">Explore the wall</button>
</header>
<section class="info">
  <h2>The Pixel Wall</h2>
  <p>Choose a square to explore our advertising wall.</p>
  <p id="status">Demonstration: 1,000,000 pixels planned</p>
</section>
<div id="wall" class="wall"></div>
<footer>
  <p>Currently under construction. Purchases are not open.</p>
</footer>

<script>
const wall = document.getElementById('wall');
const status = document.getElementById('status');
const columns = 100;
const total = 10000;

let dragging = false;
let startIndex = null;
let selected = new Set();

function updateSelection(endIndex) {
  const startRow = Math.floor(startIndex / columns);
  const startCol = startIndex % columns;
  const endRow = Math.floor(endIndex / columns);
  const endCol = endIndex % columns;

  const minRow = Math.min(startRow, endRow);
  const maxRow = Math.max(startRow, endRow);
  const minCol = Math.min(startCol, endCol);
  const maxCol = Math.max(startCol, endCol);

  selected.clear();

  wall.querySelectorAll('.pixel.selected')
    .forEach(pixel => pixel.classList.remove('selected'));

  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      const index = row * columns + col;
      selected.add(index);
      wall.children[index].classList.add('selected');
    }
  }

  const count = selected.size;
  status.textContent =
    count + ' demo pixels selected — indicative price: NZ$' +
    count.toLocaleString('en-NZ') +
    '. Purchases are not open yet.';
}

for (let i = 0; i < total; i++) {
  const pixel = document.createElement('button');
  pixel.className = 'pixel';
  pixel.type = 'button';
  pixel.setAttribute('aria-label', 'Demo pixel ' + (i + 1));
  pixel.title = 'Drag to select an advertising block';

  pixel.addEventListener('pointerdown', event => {
    event.preventDefault();
    dragging = true;
    startIndex = i;
    updateSelection(i);
  });

  pixel.addEventListener('pointerenter', () => {
    if (dragging) updateSelection(i);
  });

  wall.appendChild(pixel);
}

window.addEventListener('pointerup', () => {
  dragging = false;
});

</script>
</body>
</html>
